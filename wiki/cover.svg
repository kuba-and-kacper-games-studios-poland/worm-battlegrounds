<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15121f"/>
      <stop offset="0.55" stop-color="#2a2150"/>
      <stop offset="1" stop-color="#5a3a6e"/>
    </linearGradient>
    <radialGradient id="boom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#ffb347"/>
      <stop offset="0.7" stop-color="#ff8a3d" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a32"/>
      <stop offset="1" stop-color="#2e1f18"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#15121f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="70" cy="90" r="2" opacity="0.7"/><circle cx="180" cy="160" r="1.5" opacity="0.5"/>
    <circle cx="430" cy="70" r="2" opacity="0.6"/><circle cx="540" cy="180" r="1.5" opacity="0.5"/>
    <circle cx="300" cy="120" r="1.5" opacity="0.4"/><circle cx="110" cy="260" r="1.5" opacity="0.4"/>
  </g>
  <circle cx="470" cy="150" r="46" fill="#f4e9d0" opacity="0.85"/>
  <circle cx="452" cy="138" r="9" fill="#d8ccb2" opacity="0.7"/>
  <!-- trajectory -->
  <path d="M150 560 Q 300 180 430 520" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="4 16" stroke-linecap="round" opacity="0.75"/>
  <!-- explosion -->
  <circle cx="430" cy="545" r="125" fill="url(#boom)"/>
  <g stroke="#fff3c4" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="430" y1="455" x2="430" y2="420"/><line x1="500" y1="480" x2="525" y2="455"/>
    <line x1="360" y1="480" x2="335" y2="455"/><line x1="520" y1="545" x2="555" y2="545"/>
  </g>
  <!-- water -->
  <rect y="760" width="600" height="140" fill="url(#sea)"/>
  <!-- left island with grass -->
  <path d="M20 800 C 40 640 110 590 170 595 C 240 600 280 660 300 720 C 315 770 300 800 290 800 Z" fill="url(#dirt)"/>
  <path d="M38 690 C 70 620 120 592 170 595 C 225 598 265 640 285 690 C 250 650 210 625 170 624 C 120 624 75 650 38 690 Z" fill="#8fe04a"/>
  <!-- right island with a crater bitten out -->
  <path d="M330 800 C 335 700 360 610 395 600 C 400 640 440 650 470 610 C 520 600 575 650 590 800 Z" fill="url(#dirt)"/>
  <path d="M362 650 C 372 620 385 603 395 600 C 400 625 412 636 425 640 C 405 640 385 640 362 650 Z M470 610 C 515 600 560 630 580 690 C 555 650 520 630 470 625 Z" fill="#8fe04a"/>
  <!-- the shooter: a small cannon on the left island -->
  <g transform="translate(150 568)">
    <rect x="-6" y="-34" width="54" height="16" rx="8" fill="#3b3552" transform="rotate(-48 0 -26)"/>
    <ellipse cx="0" cy="0" rx="34" ry="22" fill="#ff8a3d"/>
    <circle cx="-12" cy="18" r="10" fill="#272338"/><circle cx="14" cy="18" r="10" fill="#272338"/>
    <circle cx="10" cy="-6" r="6" fill="#ffffff"/><circle cx="12" cy="-6" r="3" fill="#15121f"/>
  </g>
  <!-- debris -->
  <g fill="#6b4a32">
    <rect x="380" y="470" width="12" height="10" transform="rotate(20 386 475)"/>
    <rect x="470" y="440" width="10" height="9" transform="rotate(-30 475 444)"/>
    <rect x="505" y="500" width="9" height="8"/>
  </g>
</svg>
